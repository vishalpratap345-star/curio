  function topicWeight(k) { var s = taste[k] ? taste[k].score : 0; return Math.min(4, Math.max(0.3, 1 + 0.35 * s)); }
  function totalViews() { var n = 0; Object.keys(taste).forEach(function (k) { n += taste[k].views; }); return n; }

  /* ===== picking the next story ===== */
  var seen = [], EXPLORE = 0.2, filterKey = "all", lastCard = null;
  function pickNext() {
    function pool() {
      return CARDS.filter(function (c) {
        return (filterKey === "all" || c.domainKey === filterKey) && seen.indexOf(c.key) === -1 && !(lastCard && c.key === lastCard.key);
      });
    }
    var p = pool();
    if (!p.length) { seen = []; p = pool(); }
    if (!p.length) p = CARDS.filter(function (c) { return filterKey === "all" || c.domainKey === filterKey; });
    var chosen, explored = false;
    if (filterKey === "all" && Math.random() < EXPLORE) {
      chosen = p[Math.floor(Math.random() * p.length)]; explored = true;
    } else {
      var ws = p.map(function (c) {
        var w = filterKey === "all" ? topicWeight(c.domainKey) : 1;
        if (lastCard && c.shape === lastCard.shape) w *= 0.3;   // don't repeat the same story shape back to back
        return w;
      });
      var total = ws.reduce(function (a, b) { return a + b; }, 0), r = Math.random() * total;
      chosen = p[p.length - 1];
      for (var i = 0; i < p.length; i++) { r -= ws[i]; if (r <= 0) { chosen = p[i]; break; } }
    }
    seen.push(chosen.key);
    var reason = "";
    if (filterKey === "all" && !explored && totalViews() >= 5 && taste[chosen.domainKey] && taste[chosen.domainKey].score >= 3) {
      reason = "Because you like " + DOMAINS[chosen.domainKey].label;
    }
    return { card: chosen, reason: reason };
  }

  /* ===== the reel feed ===== */
  var feed = $("feed"), reels = [], active = null, since = 0;

  function makeReel(c, reason, withHint) {
    var el = document.createElement("section");
    el.className = "reel";
    el._card = c;
    el.style.backgroundImage = "linear-gradient(165deg," + c.c1 + "," + c.c2 + ")";
    el.innerHTML =
      '<div class="emoji" aria-hidden="true"></div>' +
      '<div class="cbody"><div class="cin">' +
        '<div class="chips"><span class="tag"></span><span class="why"></span></div>' +
        '<h1 class="hook"></h1><p class="story"></p><p class="credit"></p>' +
      '</div></div>' +
      '<button class="deeper">Know more</button>';
    el.querySelector(".emoji").textContent = c.emoji;
    el.querySelector(".tag").textContent = c.domain + ", " + storySecs(c) + " sec";
    var why = el.querySelector(".why");
    if (reason) why.textContent = reason; else why.remove();
    el.querySelector(".hook").textContent = c.hook;
    el.querySelector(".story").textContent = c.story;
    el.querySelector(".credit").textContent = cardCredit(c);
    el.querySelector(".deeper").addEventListener("click", function () { el._noDwell = true; openReader(c); });
    if (withHint) { var h = document.createElement("div"); h.className = "swipehint"; h.textContent = "Swipe up for the next one \u2191"; el.appendChild(h); }
    return el;
  }

  function fit(el) {
    var body = el.querySelector(".cbody"), cin = el.querySelector(".cin");
    var hook = el.querySelector(".hook"), story = el.querySelector(".story");
    var hs = parseFloat(getComputedStyle(hook).fontSize), ss = parseFloat(getComputedStyle(story).fontSize), n = 0;
    while (cin.offsetHeight > body.clientHeight + 1 && n < 40) {
      if (ss > 13.5) { ss -= 0.5; story.style.fontSize = ss + "px"; }
      else if (hs > 19) { hs -= 1; hook.style.fontSize = hs + "px"; }
      else break;
      n++;
    }
  }

  function addReel(withHint) {
    var p = pickNext();
    lastCard = p.card;
    var el = makeReel(p.card, p.reason, withHint);
    feed.appendChild(el);
    fit(el);
    reels.push(el);
    observer.observe(el);
  }

  function trim() {   // keep the page light on long sessions
    var idx = reels.indexOf(active);
    while (reels.length > 30 && idx > 6) {
      var first = reels.shift(); idx -= 1;
      observer.unobserve(first);
      var h = first.offsetHeight;
      feed.style.scrollSnapType = "none";
      first.remove();
      feed.scrollTop -= h;
    }
    requestAnimationFrame(function () { feed.style.scrollSnapType = ""; });
  }

  function activate(el) {
    if (active === el) return;
    if (active && !active._noDwell) recordDwell(active._card, Date.now() - since);
    active = el; since = Date.now(); el._noDwell = false;
    var idx = reels.indexOf(el);
    while (reels.length < idx + 3) addReel(false);   // always keep 2 stories ready ahead
    trim();
  }

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting && e.intersectionRatio >= 0.6) activate(e.target); });
  }, { root: feed, threshold: [0.6] });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (readerCard) saveReadPos(); window._hiddenAt = Date.now(); }
    else if (window._hiddenAt) { since += Date.now() - window._hiddenAt; window._hiddenAt = 0; }
  });
  feed.addEventListener("scroll", function () {
    if (feed.scrollTop > 40) { var h = document.querySelector(".swipehint"); if (h) h.remove(); }
  }, { passive: true });

  /* ===== views: home <-> feed ===== */
  function leaveFeed() {
    if (active && !active._noDwell) recordDwell(active._card, Date.now() - since);
    active = null;
    reels.forEach(function (r) { observer.unobserve(r); });
    reels = []; feed.innerHTML = "";
  }
  function renderChips() {
    var row = $("chipsrow"); row.innerHTML = "";
    var keys = ["all"].concat(Object.keys(DOMAINS).filter(function (k) { return CARDS.some(function (c) { return c.domainKey === k; }); }));
    keys.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "fchip" + (k === filterKey ? " on" : "");
      b.textContent = k === "all" ? "All" : DOMAINS[k].short;
      b.addEventListener("click", function () { if (k !== filterKey) showFeed(k); });
      row.appendChild(b);
    });
  }
  function showFeed(key) {
    leaveFeed();
    filterKey = key; seen = []; lastCard = null;
    $("home").hidden = true; $("storylist").hidden = true; $("feedview").hidden = false; $("tabbar").hidden = false; setTab("scroll");
    renderChips();
    feed.scrollTop = 0;
    addReel(true); addReel(false); addReel(false);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { reels.forEach(fit); });
  }
  function showHome() {
    closeReader(); leaveFeed();
    $("feedview").hidden = true; $("bedtime").hidden = true; $("storylist").hidden = true; $("home").hidden = false; $("tabbar").hidden = false; setTab("home");
    renderHome();
  }
  function renderHome() {
    var box = $("tiles"); box.innerHTML = "";
    Object.keys(DOMAINS).forEach(function (k) {
      var n = CARDS.filter(function (c) { return c.domainKey === k; }).length;
      if (!n) return;
      var D = DOMAINS[k], b = document.createElement("button");
      b.className = "tile";
      b.style.background = "linear-gradient(150deg," + D.c1 + "," + D.c2 + ")";
      b.innerHTML = '<span class="temoji" aria-hidden="true"></span><span><b></b><small></small></span>';
      b.querySelector(".temoji").textContent = D.emoji;
      b.querySelector("b").textContent = D.short;
      b.querySelector("small").textContent = n + (n === 1 ? " fact" : " facts");
      b.addEventListener("click", function () { showFeed(k); });
      box.appendChild(b);
    });
    var soon = document.querySelector("#doorTonight .soon");
    if (soon) soon.textContent = storiesFromFile ? STORIES.length + (STORIES.length === 1 ? " story" : " stories") : "Sample";
  }
  $("doorQuick").addEventListener("click", function () { showFeed("all"); });
  $("backBtn").addEventListener("click", showHome);

  /* ===== deep reader (remembers where you stopped) ===== */
  var reader = $("reader"), maxDepth = 0, readerCard = null;
  function saveReadPos() {
    var max = reader.scrollHeight - reader.clientHeight;
    if (readerCard && max > 0) sset("curio-pos-" + readerCard.key, (reader.scrollTop / max).toFixed(3));
  }
  function openReader(c) {
    readerCard = c; recordDeeper(c); maxDepth = 0;
    $("rhead").style.background = "linear-gradient(160deg," + c.c1 + "," + c.c2 + ")";
    $("remoji").textContent = c.emoji;
    $("rtag").textContent = c.domain;
    $("rtitle").textContent = c.hook;
    $("rmeta").textContent = "About " + deepMins(c) + " min read";
    var body = $("rbody"); body.innerHTML = "";
    c.deep.forEach(function (s) {
      var h = document.createElement("h3"); h.textContent = s.h; h.style.color = c.c2; body.appendChild(h);
      s.p.forEach(function (t) { var p = document.createElement("p"); p.textContent = t; body.appendChild(p); });
    });
    if (c.takeaway) {
      var tk = document.createElement("div"); tk.className = "takeaway";
      tk.style.background = "linear-gradient(160deg," + c.c1 + "," + c.c2 + ")";
      tk.innerHTML = "<b>The takeaway</b><span></span>"; tk.querySelector("span").textContent = c.takeaway; body.appendChild(tk);
    }
    var rc = document.createElement("p"); rc.className = "rcredit";
    rc.textContent = c.made ? "Retold by AI from the source below, then checked automatically against it." : "This is an AI-written sample card.";
    body.appendChild(rc);
    var src = document.createElement("p"); src.className = "source";
    src.appendChild(document.createTextNode("Read the original: "));
    var a = document.createElement("a"); a.href = c.source.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = c.source.label;
    src.appendChild(a); body.appendChild(src);
    $("progress").style.background = c.c1;
    reader.classList.add("open"); $("rbar").classList.add("open"); reader.setAttribute("aria-hidden", "false");
    var saved = parseFloat(sget("curio-pos-" + c.key));
    var max = reader.scrollHeight - reader.clientHeight;
    var resume = saved > 0.02 && saved < 0.95 && max > 0;
    reader.scrollTop = resume ? saved * max : 0;
    $("progress").style.width = (resume ? saved * 100 : 0) + "%";
  }
  function closeReader() {
    if (!readerCard) return;
    saveReadPos();
    if (maxDepth >= 0.8) { recordFinished(readerCard); sset("curio-pos-" + readerCard.key, "0"); }
    readerCard = null;
    reader.classList.remove("open"); $("rbar").classList.remove("open"); reader.setAttribute("aria-hidden", "true");
    $("progress").style.width = "0";
    since = Date.now();
  }
  reader.addEventListener("scroll", function () {
    var max = reader.scrollHeight - reader.clientHeight;
    var ratio = max > 0 ? reader.scrollTop / max : 0;
    if (ratio > maxDepth) maxDepth = ratio;
    $("progress").style.width = (ratio * 100) + "%";
  }, { passive: true });

  /* ===== hidden founder panel: tap the logo 5 times on the homepage ===== */
  function openProfile() {
    var tv = 0, td = 0, tf = 0;
    Object.keys(taste).forEach(function (k) { tv += taste[k].views; td += taste[k].deeper; tf += taste[k].finished; });
    $("pstats").innerHTML = "";
    [["Stories seen", tv], ["Deep reads opened", td], ["Finished", tf]].forEach(function (s) {
      var d = document.createElement("div"); d.className = "pstat"; d.innerHTML = "<b></b><span></span>";
      d.querySelector("b").textContent = s[1]; d.querySelector("span").textContent = s[0]; $("pstats").appendChild(d);
    });
    $("psub").textContent = "Founder view, hidden from readers. Content source: " + (usingFile ? "cards.json (" + CARDS.length + " stories)" : "built-in samples (" + CARDS.length + " stories)") + ".";
    var box = $("pbars"); box.innerHTML = "";
    var rows = Object.keys(DOMAINS).map(function (k) { return { k: k, w: topicWeight(k) }; }).sort(function (a, b) { return b.w - a.w; });
    var max = rows[0].w;
    rows.forEach(function (r) {
      var D = DOMAINS[r.k], row = document.createElement("div"); row.className = "trow";
      row.innerHTML = '<div class="tlabel"></div><div class="ttrack"><div class="tfill"></div></div>';
      row.querySelector(".tlabel").textContent = D.emoji + " " + D.short;
      var f = row.querySelector(".tfill"); f.style.width = Math.max(6, Math.round((r.w / max) * 100)) + "%";
      f.style.background = "linear-gradient(90deg," + D.c1 + ",#FFD166)"; box.appendChild(row);
    });
    $("sheetbg").classList.add("open"); $("psheet").classList.add("open"); $("psheet").setAttribute("aria-hidden", "false");
  }
  function closeProfile() { $("sheetbg").classList.remove("open"); $("psheet").classList.remove("open"); $("psheet").setAttribute("aria-hidden", "true"); }
  var logoTaps = 0, logoTimer = null;
  $("brand").addEventListener("click", function () {
    logoTaps += 1; clearTimeout(logoTimer); logoTimer = setTimeout(function () { logoTaps = 0; }, 1500);
    if (logoTaps >= 5) { logoTaps = 0; openProfile(); }
  });
  $("closeBtn").addEventListener("click", closeReader);
  $("pcloseBtn").addEventListener("click", closeProfile);
  $("sheetbg").addEventListener("click", closeProfile);
  $("presetBtn").addEventListener("click", function () { taste = {}; saveTaste(); openProfile(); });
  document.addEventListener("keydown", function (e) {
    if (reader.classList.contains("open")) { if (e.key === "Escape") closeReader(); return; }
    if (!$("bedtime").hidden) { if (e.key === "ArrowRight") bedNext(); if (e.key === "ArrowLeft") $("pager").scrollBy({ left: -$("pager").clientWidth, behavior: "smooth" }); return; }
    if ($("feedview").hidden) { if (e.key === "Escape") closeProfile(); return; }
    if (e.key === "ArrowDown") { feed.scrollBy({ top: window.innerHeight, behavior: "smooth" }); e.preventDefault(); }
    if (e.key === "ArrowUp") { feed.scrollBy({ top: -window.innerHeight, behavior: "smooth" }); e.preventDefault(); }
    if (e.key === "Escape") closeProfile();
  });


  /* ===== stories: stories.json if it loads, built-in sample if not ===== */
  var SAMPLE_STORIES = [{
    id: "letters", sample: true, title: "Letters from the Sky", kind: "True facts, told as a story",
    source: { label: "written by AI as a sample", url: "" },
    pages: [
      "Look out of the window tonight, if you can. If the Moon is up, take a slow breath and notice it. The pale light on your face has just finished a journey of a little over a second. It left the Moon, crossed the quiet dark, and landed softly on you. You are always seeing the Moon as it was a moment ago. Nothing in the sky is ever quite right now. Everything up there is a letter that took a little time to arrive.",
      "The Sun writes letters too, but its letters take longer. Light from the Sun needs about eight minutes to reach us. So when the evening turns gold and the hills glow, you are seeing the Sun as it was eight minutes ago. It is an old letter, and it is still warm. Nobody had to hurry it. It simply travelled, and now it rests on the rooftops and on the leaves, and on your hands.",
      "Now find the brightest star you can. If it is Sirius, the brightest star in our night sky, its light has been travelling for about eight and a half years. A child who was just starting school when that light set out would be a little older now. The letter crossed enormous, silent space the whole way, never rushing and never stopping, and tonight it found your window.",
      "Far from city lights, on a very dark night, you may spot a faint, soft smudge. That is the Andromeda galaxy, an island of countless stars. Its light left about two and a half million years ago, long before anyone had written a word or drawn a map. It has been crossing the dark all that time, and it is one of the farthest things people can see with their own eyes.",
      "So the sky is full of old letters, each one folded small, each one carried across a long silence. Some took a second. Some took millions of years. All of them arrived, and tonight they arrived at a quiet window where someone was looking. There is nothing left to read. The letters can keep coming without you. Let your eyes grow heavy, and let the sky keep its own time."
    ]
  }];
  var STORIES = SAMPLE_STORIES, storiesFromFile = false, currentStory = null, bedIdx = 0;

  function loadStories() {
    return fetch("stories.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("no file"); return r.json(); })
      .then(function (d) {
        var list = ((d && d.stories) || []).filter(function (x) { return x && x.title && x.pages && x.pages.length; });
        if (list.length) { STORIES = list; storiesFromFile = true; }
      })
      .catch(function () { /* no stories.json yet: keep the sample */ });
  }
  function storyCredit(st) { return st.sample ? "AI-written sample" : "AI-retold from " + ((st.source && st.source.label) || "a public-domain book"); }

  function showStoryList() {
    $("home").hidden = true; $("feedview").hidden = true; $("bedtime").hidden = true; $("storylist").hidden = false;
    $("tabbar").hidden = false; setTab("home");
    var box = $("slist"); box.innerHTML = "";
    STORIES.forEach(function (st) {
      var b = document.createElement("button"); b.className = "srow";
      b.innerHTML = '<span class="stitle"></span><span class="smeta"></span><span class="scredit"></span>';
      b.querySelector(".stitle").textContent = st.title;
      b.querySelector(".smeta").textContent = (st.kind || "Story") + ", " + st.pages.length + " pages";
      b.querySelector(".scredit").textContent = st.sample ? "AI-written sample" : "AI-retold";
      b.addEventListener("click", function () { showBedtime(st); });
      box.appendChild(b);
    });
    $("storylist").scrollTop = 0;
  }

  function showBedtime(st) {
    currentStory = st;
    $("home").hidden = true; $("storylist").hidden = true; $("bedtime").hidden = false; $("tabbar").hidden = true;
    var pager = $("pager"); pager.innerHTML = ""; $("bdots").innerHTML = "";
    st.pages.forEach(function (t, i) {
      var pg = document.createElement("section"); pg.className = "bpage";
      var inner = document.createElement("div"); inner.className = "bin";
      if (i === 0) {
        var k = document.createElement("div"); k.className = "bkind"; k.textContent = st.kind || "Story"; inner.appendChild(k);
        var h = document.createElement("h2"); h.className = "btitle"; h.textContent = st.title; inner.appendChild(h);
      }
      var p = document.createElement("p"); p.textContent = t; inner.appendChild(p);
      if (i === 0) { var c1 = document.createElement("div"); c1.className = "bcredit"; c1.textContent = storyCredit(st); inner.appendChild(c1); }
      if (i === st.pages.length - 1) {
        if (st.moral) { var m = document.createElement("div"); m.className = "bmoral"; m.textContent = st.moral; inner.appendChild(m); }
        var e = document.createElement("div"); e.className = "bend"; e.textContent = "The end. Goodnight."; inner.appendChild(e);
        var c2 = document.createElement("div"); c2.className = "bcredit";
        c2.appendChild(document.createTextNode(storyCredit(st)));
        if (st.source && st.source.url) {
          c2.appendChild(document.createTextNode(". Source: "));
          var a = document.createElement("a"); a.href = st.source.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "original text";
          c2.appendChild(a);
        }
        inner.appendChild(c2);
      }
      pg.appendChild(inner); pager.appendChild(pg);
      var d = document.createElement("span"); d.className = "bdot"; $("bdots").appendChild(d);
    });
    pager.scrollLeft = 0; $("dimmer").classList.remove("on");
    updateBed();
  }
  function updateBed() {
    var pager = $("pager"), n = currentStory.pages.length;
    bedIdx = Math.max(0, Math.min(n - 1, Math.round(pager.scrollLeft / pager.clientWidth)));
    [].forEach.call($("bdots").children, function (d, i) { d.classList.toggle("on", i === bedIdx); });
    var last = bedIdx === n - 1;
    $("bnext").textContent = last ? "Back to stories" : "Next page";
    $("dimmer").classList.toggle("on", last);
  }
  function bedNext() {
    var pager = $("pager"), n = currentStory.pages.length;
    if (bedIdx >= n - 1) { showStoryList(); return; }
    pager.scrollTo({ left: (bedIdx + 1) * pager.clientWidth, behavior: "smooth" });
  }
  $("pager").addEventListener("scroll", function () { if (currentStory) updateBed(); }, { passive: true });
  $("bnext").addEventListener("click", bedNext);
  $("bedBack").addEventListener("click", showStoryList);
  $("doorTonight").addEventListener("click", showStoryList);


  /* ===== bottom tabs ===== */
  function setTab(name) {
    $("tabHome").classList.toggle("on", name === "home");
    $("tabScroll").classList.toggle("on", name === "scroll");
  }
  $("tabHome").addEventListener("click", function () { if (!$("home").hidden) return; showHome(); });
  $("tabScroll").addEventListener("click", function () { if (!$("feedview").hidden && filterKey === "all") return; showFeed("all"); });

  /* ===== start ===== */
  Promise.all([loadCards(), loadStories()]).then(function () { $("home").hidden = false; $("tabbar").hidden = false; setTab("home"); renderHome(); });
</script>
</body>
</html>
